name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 可选代码签名：配置仓库 Secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD 后自动签名
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable pnpm (for vendor/orb)
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      # 关键：把构建号真正写进 package.json 的 version。
      # electron-updater 比较的是 app 版本号与 latest.yml 里的 version，
      # 两者都源自 package.json；只改 release tag 名不会触发更新。
      - name: Compute and stamp build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # 读取 package.json 的基础版本，并剥离 CI 追加的构建号后缀（.N），
          # 避免多次构建把版本号累积成 1.0.0.8.9 这种非法/不单调的形式。
          BASE="$(node -p "require('./package.json').version")"
          CORE="$(printf '%s' "$BASE" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)([.-].*)?$/\1/')"
          if ! printf '%s' "$CORE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::无法从 package.json 解析出 x.y.z 版本号（原始值: $BASE）"
            exit 1
          fi
          RUN="${{ github.run_number }}"
          VERSION="${CORE}.${RUN}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stamped version: $VERSION"

      - name: Install main dependencies
        run: npm ci

      - name: Install vendor/orb dependencies (pnpm)
        run: |
          cd vendor/orb
          pnpm install --no-frozen-lockfile

      - name: Build application (TypeScript + assets)
        run: npm run build

      - name: Package Windows installer (NSIS) + update metadata
        run: npm run dist -- --publish never

      - name: Verify update metadata matches stamped version
        shell: bash
        run: |
          set -euo pipefail
          YML="release/latest.yml"
          if [ ! -f "$YML" ]; then
            echo "::error::$YML not found"; exit 1
          fi
          echo "--- $YML ---"
          cat "$YML"
          STAMPED="${{ steps.version.outputs.VERSION }}"
          if ! grep -q "^version: ${STAMPED}$" "$YML"; then
            echo "::error::latest.yml version does not match stamped version ${STAMPED}"
            exit 1
          fi
          if ! grep -q "sha512:" "$YML"; then
            echo "::error::latest.yml is missing sha512 (update integrity check would fail)"
            exit 1
          fi
          echo "OK: latest.yml version=$STAMPED with sha512"

      - name: Upload installer + update metadata as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-v${{ steps.version.outputs.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Prepare release notes from template
        shell: bash
        run: |
          sed "s/__VERSION__/${{ steps.version.outputs.VERSION }}/g" .github/release-body-template.md > release-body.md
          echo "Generated release-body.md";

      # 不再使用 update_release 覆盖同一个 tag：
      # 每次构建生成独立 tag，旧版用户的增量更新才不会因资产被替换而失败。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Jarvis v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          draft: false
          prerelease: false
