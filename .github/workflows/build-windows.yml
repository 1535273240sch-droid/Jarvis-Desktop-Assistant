name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 可选代码签名：配置仓库 Secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD 后自动签名
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable pnpm (for vendor/orb)
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $v = (node -p "require('./package.json').version")
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Install main dependencies
        run: npm ci

      - name: Install vendor/orb dependencies (pnpm)
        run: |
          cd vendor/orb
          pnpm install --no-frozen-lockfile

      - name: Build application (TypeScript + assets)
        run: npm run build

      - name: Package Windows installer (NSIS) + update metadata
        run: npm run dist -- --publish never

      - name: Upload installer + update metadata as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-v${{ steps.version.outputs.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Generate release notes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $body = @"
# 🚀 Jarvis v$v

> **Windows 11 桌面 AI 助理** — WebGPU 流体悬浮球 · 实时全双工语音 · MCP 桌面工具自主执行 · 多模态屏幕视觉

---

## ✨ 核心功能

| 功能 | 说明 |
| --- | --- |
| 🔮 **流体玻璃悬浮球** | WebGPU 硬件加速 · WGSL 着色器 · 6 态状态机 · 音频 FFT 波形响应 |
| 🎙️ **实时语音对话** | 全双工流式 · 24kHz PCM16 · 智能打断 · 多音色切换 |
| ⚙️ **MCP 桌面工具** | 12 项生产力工具 · 进程/文件/代码编辑 · 安全闸门 + 审计日志 |
| 👁️ **屏幕视觉理解** | 截屏识别 · 坐标估算 · 模拟鼠标键盘操作 |

---

## 📥 下载安装

- 安装包：`Jarvis-Setup-$v-x64.exe`
- 系统要求：**Windows 11 x64**（需支持 WebGPU 的显卡驱动）
- 提示：安装包未签名，SmartScreen 若提示“未知发布者”，点「更多信息 → 仍要运行」即可

---

## 🔄 自动更新

应用每次启动会自动检查新版本，发现更新后后台下载，重启即完成升级；也可在系统托盘菜单点「检查更新」手动触发。

---

## 🆕 更新日志

### v$v
- 首版发布 🎉：WebGPU 悬浮球、实时语音、MCP 工具执行、屏幕视觉
"@
          Set-Content -Path release-body.md -Value $body -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Jarvis v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          draft: false
          prerelease: false
          update_release: true
