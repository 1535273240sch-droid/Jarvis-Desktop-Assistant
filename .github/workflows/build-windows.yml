name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 若在仓库 Secrets 里配置了 WIN_CSC_LINK(证书 base64/路径) 与 WIN_CSC_KEY_PASSWORD，
      # electron-builder 会自动对安装包签名；未配置则跳过签名正常构建(带未签名警告)。
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable pnpm (for vendor/orb)
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $v = (node -p "require('./package.json').version")
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Install main dependencies
        run: npm ci

      - name: Install vendor/orb dependencies (pnpm)
        run: |
          cd vendor/orb
          pnpm install --no-frozen-lockfile

      - name: Build application (TypeScript + assets)
        run: npm run build

      - name: Package Windows installer (NSIS)
        run: npm run dist -- --publish never

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-v${{ steps.version.outputs.VERSION }}
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Jarvis v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Jarvis v${{ steps.version.outputs.VERSION }}

            Windows 11 桌面 AI 助手（WebGPU 悬浮球 + 实时语音 + 工具执行 + 屏幕视觉）。

            自动构建的安装包，点击下载 `Jarvis-Setup-${{ steps.version.outputs.VERSION }}-x64.exe`。
          files: release/*.exe
          draft: false
          prerelease: false
          update_release: true
