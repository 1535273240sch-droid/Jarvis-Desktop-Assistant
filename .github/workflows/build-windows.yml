name: Build Windows Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 默认最小权限：构建/验证 job 只需读取仓库内容。
# 发布 Release 所需的 contents: write 仅授予独立的 release job。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Enable pnpm (for vendor/orb)
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install main dependencies
        run: npm ci

      - name: Install vendor/orb dependencies (pnpm)
        run: |
          cd vendor/orb
          pnpm install --no-frozen-lockfile

      # 放在依赖安装之后：下面要用仓库自带的 semver 做合法性自检，
      # 若放在 npm ci 之前会因模块不存在而失败。
      #
      # 版本号必须是合法 semver —— electron-builder 的 normalizePackageData
      # 会执行 semver.valid() 校验，像 1.0.0.8 这种四段式会被直接拒绝
      # （Invalid version）。也不能用 1.0.0-8 预发布形式：semver 语义下
      # 预发布小于正式版，会被 electron-updater 判为降级。
      # 因此用 run_number 顶替 patch 段，并对已有 patch 取 max 保证单调递增。
      # 这一步必须改 package.json 本体：app 版本与 latest.yml 的 version
      # 都源自它，只改 release tag 名不会触发更新。
      - name: Compute and stamp build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version")"
          CORE="$(printf '%s' "$BASE" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          if ! printf '%s' "$CORE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::无法从 package.json 解析出 x.y.z 版本号（原始值: $BASE）"
            exit 1
          fi
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          RUN="${{ github.run_number }}"
          if [ "$RUN" -gt "$PATCH" ]; then NEWPATCH="$RUN"; else NEWPATCH="$PATCH"; fi
          VERSION="${MAJOR}.${MINOR}.${NEWPATCH}"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " "$VERSION"

          # 自检：确保落盘的版本号能被 electron-builder 接受
          node -e "
            const semver = require('semver');
            const v = require('./package.json').version;
            if (!semver.valid(v, { loose: true })) {
              console.error('::error::生成的版本号不是合法 semver: ' + v);
              process.exit(1);
            }
            console.log('Stamped version: ' + v + ' (valid semver)');
          "
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build application (TypeScript + assets)
        run: npm run build

      # 工具执行闭环回归测试：验证「打开软件/打开网址/输入提交/MCP 调用与白名单」这些
      # 用户实际抱怨过的链路确实能跑通。失败即阻断发布，避免带着坏功能出台。
      - name: Verify tool execution end-to-end
        run: node scripts/run.mjs verify-tools

      # 桌面任务体系回归测试（纯逻辑，无需 GUI）：动作语义分类、日志脱敏、
      # 提示注入防护、微信草稿去重、任务持久化冒烟。失败即阻断发布。
      - name: Verify desktop task suite
        run: node scripts/run.mjs verify-tasks

      # 悬浮球恢复链路回归（纯逻辑/一致性，无需 GPU）：验证「设备丢失 → 重建」
      # 路径不再终态停摆（退避序列 + 宿主兜底参数），并强制 模块源 orb-renderer.ts、
      # 模板源 code-export.ts、构建产物 orb.html 三层的恢复标记一致 —— 拦的是
      # 「只改产物被下次构建覆盖」的历史坑，以及生成器/产物的音频放大值漂移。
      - name: Verify orb recovery path
        run: node scripts/run.mjs verify-orb

      # 信息简报回归（纯逻辑，不依赖外网；--live 联网检查不在 CI 跑）：
      # RSS/Atom 与 GitHub Trending 解析、注入过滤、LLM 整理与降级、缓存、
      # open_path 白名单判断。失败即阻断发布。
      - name: Verify briefing suite
        run: node scripts/run.mjs verify-briefing

      # 长任务执行中断专项回归：验证「说一遍就能完整执行」这个用户实测痛点
      # 的四个根因均已修复（执行态看门狗不再固定 60s、executing 不再被
      # barge-in 误打断、工具输出掐头去尾保留、response.done 兜底不再
      # 把 executing 打回 idle）。失败即阻断发布。
      - name: Verify long-task execution continuity
        run: node scripts/run.mjs verify-execution

      # 可选代码签名：仅在非 PR 构建注入密钥。PR 事件不读取签名密钥，
      # 只产出未签名安装包用于构建/回归校验；发布用的签名产物走 push 事件。
      - name: Package Windows installer (NSIS) + update metadata
        env:
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npm run dist -- --publish never

      - name: Verify update metadata matches stamped version
        shell: bash
        run: |
          set -euo pipefail
          YML="release/latest.yml"
          if [ ! -f "$YML" ]; then
            echo "::error::$YML not found"; exit 1
          fi
          echo "--- $YML ---"
          cat "$YML"
          STAMPED="${{ steps.version.outputs.VERSION }}"
          if ! grep -q "^version: ${STAMPED}$" "$YML"; then
            echo "::error::latest.yml version 与构建版本 ${STAMPED} 不一致"
            exit 1
          fi
          if ! grep -q "sha512:" "$YML"; then
            echo "::error::latest.yml 缺少 sha512，更新完整性校验会失败"
            exit 1
          fi
          echo "OK: latest.yml version=$STAMPED with sha512"

      - name: Prepare release notes from template
        shell: bash
        run: |
          sed "s/__VERSION__/${{ steps.version.outputs.VERSION }}/g" .github/release-body-template.md > release-body.md
          echo "Generated release-body.md";

      # 安装包、更新元数据与发布说明一并上传，供独立的 release job 取用。
      - name: Upload installer + update metadata as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Jarvis-Setup-v${{ steps.version.outputs.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release-body.md
          if-no-files-found: error
          retention-days: 14

  # 独立发布 job：仅在非 PR 事件运行，独占 contents: write 权限。
  # PR 场景下整个 job 被跳过，既不发布 Release，也不触碰签名密钥。
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: Jarvis-Setup-v${{ needs.build.outputs.version }}

      # 不再使用 update_release 覆盖同一个 tag：
      # 每次构建生成独立 tag，旧版用户的增量更新才不会因资产被替换而失败。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "Jarvis v${{ needs.build.outputs.version }}"
          body_path: release-body.md
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          draft: false
          prerelease: false
