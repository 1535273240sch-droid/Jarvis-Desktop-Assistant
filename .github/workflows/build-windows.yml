name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 可选代码签名：配置仓库 Secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD 后自动签名
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable pnpm (for vendor/orb)
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $v = (node -p "require('./package.json').version")
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Install main dependencies
        run: npm ci

      - name: Install vendor/orb dependencies (pnpm)
        run: |
          cd vendor/orb
          pnpm install --no-frozen-lockfile

      - name: Build application (TypeScript + assets)
        run: npm run build

      - name: Package Windows installer (NSIS) + update metadata
        run: npm run dist -- --publish never

      - name: Upload installer + update metadata as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-v${{ steps.version.outputs.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Prepare release notes from template
        shell: bash
        run: |
          sed "s/__VERSION__/${{ steps.version.outputs.VERSION }}/g" .github/release-body-template.md > release-body.md
          echo "Generated release-body.md";

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Jarvis v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          draft: false
          prerelease: false
          update_release: true
